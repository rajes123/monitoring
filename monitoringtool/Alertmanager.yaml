apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resource-alerts
  namespace: monitoring
spec:
  groups:
    - name: resource-alerts.rules
      rules:
        - alert: HighCpuUsage
          expr: 100 - (avg by(instance)(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 40
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage detected"
            description: "CPU usage is above 70% on instance {{ $labels.instance }}"
        - alert: HighRamUsage
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 40
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High RAM usage detected"
            description: "RAM usage is above 70% on instance {{ $labels.instance }}"
        - alert: HighDiskUsage
          expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High Disk usage detected"
            description: "Disk usage is above 80% on instance {{ $labels.instance }}"
