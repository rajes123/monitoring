apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: factoreld-eks-logs
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://18.116.41.217:3100/loki/api/v1/push
        tenant_id: factoreld-eks-logs

    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - docker: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: (.+)
            target_label: app
          - source_labels: [__meta_kubernetes_pod_label_component]
            regex: (.+)
            target_label: component
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node_name
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - action: replace
            source_labels: [namespace, app]
            target_label: job
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: factoreld-eks-logs
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
      - name: promtail
        image: grafana/promtail:2.9.0
        args:
        - -config.file=/etc/promtail/promtail.yaml
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        - name: run
          mountPath: /run/promtail
        - name: logs
          mountPath: /var/log
          readOnly: true
        ports:
        - containerPort: 9080
          name: http-metrics
        securityContext:
          readOnlyRootFilesystem: true
          runAsGroup: 0
          runAsUser: 0
      volumes:
      - name: config
        configMap:
          name: promtail-config
      - name: run
        hostPath:
          path: /run/promtail
      - name: logs
        hostPath:
          path: /var/log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: factoreld-eks-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
- apiGroups: [""]
  resources:
  - nodes
  - nodes/proxy
  - services
  - endpoints
  - pods
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
- kind: ServiceAccount
  name: promtail
  namespace: factoreld-eks-logs
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-cleanup
  namespace: factoreld-eks-logs
spec:
  schedule: "0 0 */5 * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: log-cleaner
          containers:
          - name: log-cleaner
            image: busybox:1.35
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting log cleanup..."
              find /var/log -type f -mtime +5 -delete
              echo "Log cleanup completed"
            volumeMounts:
            - name: logs
              mountPath: /var/log
            securityContext:
              privileged: true
          restartPolicy: OnFailure
          volumes:
          - name: logs
            hostPath:
              path: /var/log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-cleaner
  namespace: factoreld-eks-logs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: log-cleaner
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: log-cleaner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: log-cleaner
subjects:
- kind: ServiceAccount
  name: log-cleaner
  namespace: factoreld-eks-logs
