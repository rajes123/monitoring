# HorizontalPodAutoscaler configuration for auto-scaling pods based on CPU utilization
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mobile-hpa
  namespace: {{PROJECT}}-ingress
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mobile-deployment
  minReplicas: 2  # Minimum number of pods
  maxReplicas: 5  # Maximum number of pods
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70  # Scale up when CPU utilization exceeds 70%
---
# ServiceAccount for the CronJobs to use
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronjob-scaler
  namespace: {{PROJECT}}-ingress
---
# Role to allow scaling deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-scaler
  namespace: {{PROJECT}}-ingress
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch", "update"]
---
# RoleBinding to connect the ServiceAccount to the Role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-deployment-scaler
  namespace: {{PROJECT}}-ingress
subjects:
- kind: ServiceAccount
  name: cronjob-scaler
  namespace: {{PROJECT}}-ingress
roleRef:
  kind: Role
  name: deployment-scaler
  apiGroup: rbac.authorization.k8s.io
---
# CronJob to scale up pods at 9:00 AM IST (3:30 AM UTC)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-up-morning
  namespace: {{PROJECT}}-ingress
spec:
  schedule: "30 3 * * *"  # 3:30 AM UTC = 9:00 AM IST
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cronjob-scaler
          containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - kubectl scale deployment/mobile-deployment -n {{PROJECT}}-ingress --replicas=6
          restartPolicy: OnFailure
---
# CronJob to scale down pods at 12:30 PM IST (7:00 AM UTC)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scale-down-afternoon
  namespace: {{PROJECT}}-ingress
spec:
  schedule: "0 7 * * *"  # 7:00 AM UTC = 12:30 PM IST
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: cronjob-scaler
          containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - kubectl scale deployment/mobile-deployment -n {{PROJECT}}-ingress --replicas=2
          restartPolicy: OnFailure
