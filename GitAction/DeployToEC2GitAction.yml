name: Push-Code-to-EC2
# Trigger deployment only on push to development branch
on:
  push:
    branches:
      - development #branch name
jobs:
  deploy:
    name: Deploy to EC2 on development branch push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Deploy code to EC2 via SSH
      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v2.1.5
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.HOST_DNS }}
          REMOTE_USER: ${{ secrets.USERNAME }}
          TARGET: ${{ secrets.TARGET_DIR }}

      # Step 3: Restart application using PM2
      - name: Restart PM2 services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Navigating to backend directory"
            cd /home/ubuntu/backend

            echo "Stopping existing PM2 processes"
            sudo pm2 stop all

            echo "Installing dependencies"
            sudo npm install

            echo "Restarting PM2 processes"
            sudo pm2 restart all --watch

            pm2 stop cronjobs || true
            npm install
            pm2 restart server

      # Step 4: Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1